name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GX_KEYSTORE_PASSWORD: ${{ secrets.GX_KEYSTORE_PASSWORD }}
      GX_KEY_ALIAS: ${{ secrets.GX_KEY_ALIAS }}
      GX_KEY_PASSWORD: ${{ secrets.GX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Generate and validate shared app
        run: |
          npm ci
          npm run validate

      - name: Restore release signing key
        env:
          GX_KEYSTORE_BASE64: ${{ secrets.GX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GX_KEYSTORE_BASE64" ]; then
            echo "$GX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/guanxiang-release.p12"
            echo "GX_KEYSTORE_FILE=$RUNNER_TEMP/guanxiang-release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease :app:lintRelease

      - name: Name APK
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp android/app/build/outputs/apk/release/app-release.apk "Guanxiang-Android-${VERSION}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "Guanxiang-Android-${VERSION}.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guanxiang-Android-APK
          path: |
            Guanxiang-Android-*.apk
            Guanxiang-Android-*.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Guanxiang-Android-*.apk
            Guanxiang-Android-*.aab
          generate_release_notes: true
